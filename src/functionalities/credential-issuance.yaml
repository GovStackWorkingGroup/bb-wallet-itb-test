id: credential-issuance
requirements:
  - id: '01'
    level: RECOMMENDED
    observability:
    mutability:
    title: The credential issuer should be able to validate the wallet before issuing the credentials
    content: "The credential issuer SHOULD be able to validate the wallet before\nissuing
      the credentials"
  - id: '02'
    level: REQUIRED
    observability:
    mutability:
    title: The wallet must only proceed to request/accept issuance after successful holder authentication as required by the issuer
    content: "The Wallet MUST only proceed to request/accept issuance after successful\n\
      holder authentication as required by the issuer."
  - id: '03'
    level: REQUIRED
    observability:
    mutability:
    title: The credential wallet must be able to trust the credential issuer before requesting credentials
    content: "The credential wallet MUST be able to trust the credential issuer before\n\
      requesting the credentials"
  - id: '04'
    level: REQUIRED
    observability:
    mutability:
    title: The credential wallet must be able to request credentials from a trusted credential issuer
    content: "The credential wallet MUST be able to request credentials from a trusted\n\
      credential issuer"
  - id: '05'
    level: REQUIRED
    observability:
    mutability:
    title: The credential wallet must be able to validate the credential before storing the credentials
    content: "The credential wallet MUST be able to validate the credential before\n\
      storing the credentials"
  - id: '06'
    level: REQUIRED
    observability:
    mutability:
    title: The credential wallet must enable cryptographic mechanisms to store the credentials
    content: "The credential wallet MUST enable cryptographic mechanisms to store the\n\
      credentials"
  - id: '07'
    level: REQUIRED
    observability:
    mutability:
    title: the credential wallet must have trusted hardware providing a secure environment (tamper-proof) and storage for cryptographic assets such as keys
    content: "The credential wallet MUST have trusted hardware providing a secure\n\
      environment (tamper-proof) and storage for cryptographic assets such as\nkeys"
