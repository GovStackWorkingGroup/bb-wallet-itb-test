id: presenting-a-credential
requirements:
  - id: '01'
    level: required
    observability:
    mutability:
    title: |
      The wallet MUST provide mechanisms that enable a credential verifier to
      establish trust in the wallet before the verifier requests a verifiable
      presentation.
    content: |
      The wallet MUST provide mechanisms that enable a credential verifier to
      establish trust in the wallet before the verifier requests a verifiable
      presentation.

  - id: '02'
    level: required
    observability:
    mutability:
    title: |
      The wallet MUST be able to receive and process a credential verifier's
      request for a verifiable presentation.
    content: |
      The wallet MUST be able to receive and process a credential verifier's
      request for a verifiable presentation.

  - id: '03'
    level: required
    observability:
    mutability:
    title: |
      The credential wallet MUST be able to validate the verifier before
      presenting a credential
    content: |
      The credential wallet MUST be able to validate the verifier before
      presenting a credential

  - id: '04'
    level: recommended
    observability:
    mutability:
    title: |
      The credential wallet SHOULD capture the holder's consent before the
      credentials are presented to any verifier.
    content: |
      The credential wallet SHOULD capture the holder's consent before the
      credentials are presented to any verifier.

  - id: '05'
    level: recommended
    observability:
    mutability:
    title: |
      The credential issuer SHOULD NOT be involved in the presentation process
    content: |
      The credential issuer SHOULD NOT be involved in the presentation process

  - id: '06'
    level: recommended
    observability:
    mutability:
    title: |
      The credential wallet (with the holder's consent) SHOULD be able to
      present a selected subset of the data fields (claims) from a credential
      while other fields are not revealed to the verifier.
    content: |
      The credential wallet (with the holder's consent) SHOULD be able to
      present a selected subset of the data fields (claims) from a credential
      while other fields are not revealed to the verifier.

  - id: '07'
    level: required
    observability:
    mutability:
    title: |
      The wallet MUST be able to present a verifiable presentation to the
      credential verifier in response to a valid request.
    content: |
      The wallet MUST be able to present a verifiable presentation to the
      credential verifier in response to a valid request.

  - id: '08'
    level: recommended
    observability:
    mutability:
    title: |
      The credential verifier SHOULD be able to verify the presentations after
      receiving the presentation
    content: |
      The credential verifier SHOULD be able to verify the presentations after
      receiving the presentation

  - id: '09'
    level: recommended
    observability:
    mutability:
    title: |
      The credential wallet SHOULD enable the holder to present a pseudonym
      instead of their real identity when authenticating online or presenting
      credentials, except in cases where identification is mandatory.
    content: |
      The credential wallet SHOULD enable the holder to present a pseudonym
      instead of their real identity when authenticating online or presenting
      credentials, except in cases where identification is mandatory.

  - id: '10'
    level: recommended
    observability:
    mutability:
    title: |
      The credential verifier SHOULD NOT be able to link two presentations to
      the same holder (unless the holder's information is provided as part of
      the presentation)
    content: |
      The credential verifier SHOULD NOT be able to link two presentations to
      the same holder (unless the holder's information is provided as part of
      the presentation)

  - id: '11'
    level: recommended
    observability:
    mutability:
    title: |
      Two credential verifiers SHOULD NOT be able to link two presentation
      transactions to the same holder by sharing the received presentations
    content: |
      Two credential verifiers SHOULD NOT be able to link two presentation
      transactions to the same holder by sharing the received presentations

  - id: '12'
    level: recommended
    observability:
    mutability:
    title: |
      After receiving a presentation the credential verifier SHOULD NOT be able
      to prove to any third party that the holder had presented the credentials
      to the verifier for identification purposes earlier.
    content: |
      After receiving a presentation the credential verifier SHOULD NOT be able
      to prove to any third party that the holder had presented the credentials
      to the verifier for identification purposes earlier.

  - id: '13'
    level: recommended
    observability:
    mutability:
    title: |
      The credential wallet backend SHOULD NOT be able to track where the
      credentials are being presented or learn details about the attributes of
      any transactions performed by the Holder
    content: |
      The credential wallet backend SHOULD NOT be able to track where the
      credentials are being presented or learn details about the attributes of
      any transactions performed by the Holder

  - id: '14'
    level: recommended
    observability:
    mutability:
    title: |
      The credential verifier SHOULD NOT be able to prove to any third party the
      credential's authenticity and the integrity of its attributes that the
      verifier had previously verified.
    content: |
      The credential verifier SHOULD NOT be able to prove to any third party the
      credential's authenticity and the integrity of its attributes that the
      verifier had previously verified.

  - id: '15'
    level: recommended
    observability:
    mutability:
    title: |
      The credential issuer and the credential verifier should not be able to
      link an issuance and presentation session to the same holder (unless the
      Holder provides sufficiently identifying information as part of their
      authentication to the Issuer and as part of the presented credential
      shared with the verifier)
    content: |
      The credential issuer and the credential verifier should not be able to
      link an issuance and presentation session to the same holder (unless the
      Holder provides sufficiently identifying information as part of their
      authentication to the Issuer and as part of the presented credential
      shared with the verifier)
