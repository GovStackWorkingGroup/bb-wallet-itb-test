name: Publish as ITB test suites
on: [push]
jobs:
  Publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - run: |
          curl https://codeberg.org/categulario/govstack-itb-integration/raw/branch/main/src/itb_integration/cli.py -o cli.py
      - run: |
          python cli.py -o build src/
      - run: |
          ls -lah build/
