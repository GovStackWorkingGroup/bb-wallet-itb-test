name: Publish as ITB test suites
on: [push]
jobs:
  Publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - run: |
          curl https://codeberg.org/categulario/govstack-itb-integration/raw/branch/main/src/itb_integration/convert.py -o convert.py
      - run: |
          python convert.py -o build src/
      - run: |
          ls -lah build/
      - run: |
          curl https://codeberg.org/categulario/govstack-itb-integration/raw/branch/main/src/itb_integration/upload.py -o upload.py
      - run: |
          pip install requests
      - env:
          ITB_URL: ${{ vars.ITB_URL }}
          ITB_ORG_KEY: ${{ secrets.ITB_ORG_KEY }}
          ITB_GROUP_KEY: ${{ secrets.ITB_GROUP_KEY }}
          ITB_DOMAIN_KEY: ${{ secrets.ITB_DOMAIN_KEY }}
        run: |
          python upload.py --url $ITB_URL build/
