name: Publish as ITB test suites
on: [push]
jobs:
  Publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Run the sctipt
        uses: GovstackWorkingGroup/itb-integration@828ae0a9147bf39152397fc892b1ede21b2fca0a
        with:
          src-path: ./src/
          itb-url: http://testbed.govstack.global:9000/api/rest
